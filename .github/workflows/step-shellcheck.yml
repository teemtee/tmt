name: Differential ShellCheck
on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: Committish to test
      upload_sarif:
        type: boolean
        description: Whether the sarif should be uploaded

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      sarif: ${{ steps.ShellCheck.outputs.sarif }}

    steps:
      - name: Repository checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - id: ShellCheck
        name: Differential ShellCheck
        uses: redhat-plumbers-in-action/differential-shellcheck@f51c7c0d32777d00de777131d25918617a246415 # v5.5.7
        # Note: we do not use token here to have more control of when to upload the sarif.
        #  It might be incorrect to upload them for PRs.
        #  https://github.com/github/codeql-action/issues/3578
        with:
          # Keep exclusions in sync with shellcheck-py hook in .pre-commit-config.yaml
          exclude-path: |
            tests/**
            examples/**
            tmt/steps/execute/scripts/*.sh.j2
            tmt/templates/**

      - if: ${{ always() }}
        name: Upload artifact with ShellCheck defects in SARIF format
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Differential ShellCheck SARIF
          path: ${{ steps.ShellCheck.outputs.sarif }}

  upload-sarif:
    name: Upload sarif
    runs-on: ubuntu-slim
    needs: [ lint ]
    permissions:
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Differential ShellCheck SARIF
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ needs.lint.outputs.sarif }}
    if: ${{ inputs.upload_sarif }}
