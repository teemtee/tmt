name: Sync github labels

on:
  workflow_call:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - uses: srealmoreno/label-sync-action@850ba5cef2b25e56c6c420c4feed0319294682fd # v2.0.0
        with:
          config-file: https://raw.githubusercontent.com/teemtee/tmt/main/.github/labels.yaml
