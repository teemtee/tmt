plans:
- adjust: []
  author: []
  cleanup:
    enabled: false
    phases:
    - how: tmt
      name: default-0
  contact: []
  context: {}
  description: This is just a simple smoke plan used for testing import of remote
    plans. See the related test coverage for more details.
  discover:
    enabled: true
    phases:
    - filter:
      - tag:remote
      how: fmf
      name: default-0
    tests:
    - adjust: []
      discover-phase: default-0
      link: []
      name: /tests/one
      path: /default-0/tests/tests
      serial-number: 1
      summary: Remote test one
      tag:
      - remote
      test: echo one
    - adjust: []
      discover-phase: default-0
      link: []
      name: /tests/two
      path: /default-0/tests/tests
      serial-number: 2
      summary: Remote test two
      tag:
      - remote
      test: echo two
  enabled: true
  environment: {}
  execute:
    enabled: false
    phases:
    - how: tmt
      name: default-0
    results-path: plans/import/execute/results.yaml
  finish:
    enabled: false
    phases:
    - how: shell
      name: default-0
  id: null
  link:
  - relates: https://github.com/teemtee/tmt/tree/main/tests/plan/import
  name: /plans/import
  order: 50
  prepare:
    enabled: false
    phases:
    - copr:
      - '@teemtee/latest'
      how: install
      name: enable-latest-copr
      summary: Enable copr repo with the latest tmt bits
    - how: shell
      name: disable-tag-repo
      script:
      - "dnf repolist | grep testing-farm-tag-repository || exit 0\nif command -v
        dnf5; then\n    dnf config-manager setopt testing-farm-tag-repository.enabled=0\nelse\n
        \   dnf config-manager --set-disabled testing-farm-tag-repository\nfi\n"
      summary: Completely disable the tag repository
  provision:
    enabled: false
    phases:
    - ansible: {}
      how: local
      name: default-0
  report:
    enabled: false
    phases:
    - how: display
      name: default-0
  summary: A simple smoke plan for remote testing
  tag: []
  tier: null
run:
  context: {}
  environment:
    RUN_ENV: run_value
  remove: false
  root: /path/to/fmf_root
