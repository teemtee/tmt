plans:
  - cleanup:
        phases:
          - how: tmt
            name: default-0
    description: >-
        This is just a simple smoke plan used for testing import of remote plans.
        See the related test coverage for more details.
    discover:
        enabled: true
        phases:
          - filter:
              - tag:remote
            how: fmf
            name: default-0
        tests:
          - adjust: []
            discover-phase: default-0
            link: []
            name: /tests/one
            path: /default-0/tests/tests
            serial-number: 1
            summary: Remote test one
            tag:
              - remote
            test: echo one
          - adjust: []
            discover-phase: default-0
            link: []
            name: /tests/two
            path: /default-0/tests/tests
            serial-number: 2
            summary: Remote test two
            tag:
              - remote
            test: echo two
    enabled: true
    execute:
        phases:
          - how: tmt
            name: default-0
        results-path: plans/import/execute/results.yaml
    finish:
        phases:
          - how: shell
            name: default-0
    link:
      - relates: https://github.com/teemtee/tmt/tree/main/tests/plan/import
    name: /plans/import
    order: 50
    prepare:
        phases:
          - copr:
              - '@teemtee/latest'
            how: install
            name: enable-latest-copr
            summary: Enable copr repo with the latest tmt bits
          - how: shell
            name: disable-tag-repo
            script:
              - |
                dnf repolist | grep testing-farm-tag-repository || exit 0
                if command -v dnf5; then
                    dnf config-manager setopt testing-farm-tag-repository.enabled=0
                else
                    dnf config-manager --set-disabled testing-farm-tag-repository
                fi
            summary: Completely disable the tag repository
    provision:
        phases:
          - ansible: {}
            how: local
            name: default-0
    report:
        phases:
          - how: display
            name: default-0
    summary: A simple smoke plan for remote testing
run:
    environment:
        RUN_ENV: run_value
    root: /path/to/fmf_root
