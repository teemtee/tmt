run:
    root: /path/to/fmf_root
    remove: false
    environment:
        RUN_ENV: run_value
    context: {}
plans:
  - name: /plans/import
    summary: A simple smoke plan for remote testing
    description: This is just a simple smoke plan used for testing import of
        remote plans. See the related test coverage for more details.
    enabled: true
    order: 50
    link:
      - relates: https://github.com/teemtee/tmt/tree/main/tests/plan/import
    discover:
        enabled: true
        phases:
          - name: default-0
            how: fmf
            order: 50
            url-content-type: git
            dist-git-source: false
            dist-git-download-only: false
            dist-git-install-builddeps: false
            filter:
              - tag:remote
            modified-only: false
            dist-git-init: false
            dist-git-remove-fmf-root: false
            dist-git-merge: false
            sync-repo: false
            fmf-id: false
            prune: false
        tests:
          - name: /tests/one
            discover-phase: default-0
            test: echo one
            path: /default-0/tests/tests
            summary: Remote test one
            enabled: true
            order: 50
            tag:
              - remote
            framework: shell
            manual: false
            tty: false
            duration: 5m
            restart-max-count: 1
            restart-with-reboot: false
            serial-number: 1
            result: respect
          - name: /tests/two
            discover-phase: default-0
            test: echo two
            path: /default-0/tests/tests
            summary: Remote test two
            enabled: true
            order: 50
            tag:
              - remote
            framework: shell
            manual: false
            tty: false
            duration: 5m
            restart-max-count: 1
            restart-with-reboot: false
            serial-number: 2
            result: respect
    provision:
        enabled: false
        phases:
          - become: false
            how: local
            name: default-0
            order: 50
    prepare:
        enabled: false
        phases:
          - check-first: true
            copr:
              - '@teemtee/latest'
            how: install
            missing: fail
            name: enable-latest-copr
            order: 50
            summary: Enable copr repo with the latest tmt bits
          - how: shell
            name: disable-tag-repo
            order: 50
            script:
              - |
                dnf repolist | grep testing-farm-tag-repository || exit 0
                if command -v dnf5; then
                    dnf config-manager setopt testing-farm-tag-repository.enabled=0
                else
                    dnf config-manager --set-disabled testing-farm-tag-repository
                fi
            summary: Completely disable the tag repository
    execute:
        enabled: false
        phases:
          - duration: 1h
            exit-first: false
            how: tmt
            ignore-duration: false
            interactive: false
            name: default-0
            no-progress-bar: false
            order: 50
            restraint-compatible: false
        results-path: plans/import/execute/results.yaml
    report:
        enabled: false
        phases:
          - display-guest: auto
            how: display
            name: default-0
            order: 50
    finish:
        enabled: false
        phases:
          - how: shell
            name: default-0
            order: 50
    cleanup:
        enabled: false
        phases:
          - how: tmt
            name: default-0
            order: 50
