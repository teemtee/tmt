plans:
  - cleanup:
        enabled: true
        phases:
          - how: tmt
            name: default-0
    discover:
        enabled: true
        phases:
          - how: shell
            name: default-0
            tests:
              - name: script-00
                test: echo "Execute script"
        tests:
          - adjust: []
            discover-phase: default-0
            duration: 1h
            link: []
            name: /script-00
            path: /default-0/tests
            serial-number: 1
            test: echo "Execute script"
    enabled: true
    environment:
        PLAN_ENV: plan_value
    execute:
        enabled: true
        phases:
          - how: tmt
            name: default-0
        results-path: plans/minimal/execute/results.yaml
    finish:
        enabled: true
        phases:
          - how: shell
            name: default-0
    name: /plans/minimal
    order: 50
    prepare:
        enabled: true
        phases:
          - how: shell
            name: default-0
    provision:
        enabled: true
        phases:
          - ansible: {}
            environment:
              PROVISION_ENV: provision_value
            how: container
            name: default-0
    report:
        enabled: true
        phases:
          - how: display
            name: default-0
    summary: A minimal plan
run:
    environment:
        RUN_ENV: run_value
    root: /path/to/fmf_root
