plans:
  - cleanup:
        enabled: true
        phases:
          - how: tmt
            name: default-0
    discover:
        enabled: true
        phases:
          - how: fmf
            name: default-0
            test:
              - /tests/one
            url: https://github.com/teemtee/tests
        tests:
          - adjust: []
            discover-phase: default-0
            link: []
            name: /tests/one
            path: /default-0/tests/tests
            serial-number: 1
            summary: Remote test one
            tag:
              - remote
            test: echo one
    enabled: true
    environment:
        PLAN_ENV: plan_value
    execute:
        enabled: true
        phases:
          - how: tmt
            name: default-0
        results-path: plans/remote/execute/results.yaml
    finish:
        enabled: true
        phases:
          - how: shell
            name: default-0
    name: /plans/remote
    order: 50
    prepare:
        enabled: true
        phases:
          - how: shell
            name: default-0
    provision:
        enabled: true
        phases:
          - ansible: {}
            environment:
                PROVISION_ENV: provision_value
            how: container
            name: default-0
    report:
        enabled: true
        phases:
          - how: display
            name: default-0
    summary: A remote plan
run:
    environment:
        RUN_ENV: run_value
    root: /path/to/fmf_root
